server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # Los assets llevan un hash en el nombre: si cambian, cambia la URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El worker de TypeScript descarga este fichero en tiempo de ejecución.
    location /ts-libs/ {
        expires 1d;
    }

    # Rutas del router de Vue: cualquier ruta desconocida devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
