<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0a0b0e; color: #e9ecf2; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #6fa8ff; text-decoration: none; }
    a:hover { color: #9cc3ff; }
    .mono { font-family: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #0a0b0e;">

  <div style="height: 72px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #1f242d;">
    <div style="width: 960px; display: flex; align-items: center; gap: 20px;">
      <div style="width: 40px; height: 40px; border-radius: 8px; border: 1px solid #2a313c; display: flex; align-items: center; justify-content: center; color: #949cad;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </div>
      <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px;">
        <div style="height: 6px; border-radius: 3px; background: #6fa8ff;"></div>
        <div style="height: 6px; border-radius: 3px; background: #6fa8ff;"></div>
        <div style="height: 6px; border-radius: 3px; background: #6fa8ff;"></div>
        <div style="height: 6px; border-radius: 3px; background: #4ac98d;"></div>
        <div style="height: 6px; border-radius: 3px; background: #1f242d;"></div>
        <div style="height: 6px; border-radius: 3px; background: #1f242d;"></div>
        <div style="height: 6px; border-radius: 3px; background: #1f242d;"></div>
        <div style="height: 6px; border-radius: 3px; background: #1f242d;"></div>
      </div>
      <div class="mono" style="display: flex; align-items: center; gap: 6px; color: #6fa8ff; font-size: 14px; font-weight: 600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"></path></svg>
        <span>30 XP</span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; justify-content: center;">
    <div style="width: 680px; padding-top: 72px; display: flex; flex-direction: column;">
      <span class="mono" style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; color: #6fa8ff;">EJERCICIO</span>
      <h1 style="margin: 14px 0 0; font-size: 30px; font-weight: 600; letter-spacing: -0.01em;">Quédate solo con las notas aprobadas</h1>
      <p style="margin: 12px 0 0; font-size: 17px; color: #949cad;">Elige el método que va en el hueco.</p>

      <div class="mono" style="margin-top: 32px; padding: 22px 24px; background: #101318; border: 1px solid #2a313c; border-radius: 12px; font-size: 17px; line-height: 2.1; color: #e9ecf2;">
        <div><span style="color: #c678dd;">const</span> notas <span style="color: #56b6c2;">=</span> [<span style="color: #d19a66;">3</span>, <span style="color: #d19a66;">7</span>, <span style="color: #d19a66;">9</span>, <span style="color: #d19a66;">5</span>]</div>
        <div style="display: flex; align-items: center;">
          <span><span style="color: #c678dd;">const</span> aprobadas <span style="color: #56b6c2;">=</span> notas.</span>
          <span style="display: inline-flex; align-items: center; height: 34px; padding: 0 14px; margin: 0 2px; border-radius: 8px; border: 2px solid #4ac98d; background: rgba(74, 201, 141, 0.15); color: #4ac98d;">filter</span>
          <span>((n) <span style="color: #c678dd;">=&gt;</span> n <span style="color: #56b6c2;">&gt;=</span> <span style="color: #d19a66;">5</span>)</span>
        </div>
      </div>

      <div style="margin-top: 36px; display: flex; gap: 12px; opacity: 0.35;">
        <div class="mono" style="height: 48px; padding: 0 22px; border-radius: 10px; border: 1px dashed #2a313c; display: flex; align-items: center; font-size: 17px; color: transparent;">filter</div>
        <div class="mono" style="height: 48px; padding: 0 22px; border-radius: 10px; border: 1px solid #2a313c; background: #171b22; display: flex; align-items: center; font-size: 17px; color: #e9ecf2;">map</div>
        <div class="mono" style="height: 48px; padding: 0 22px; border-radius: 10px; border: 1px solid #2a313c; background: #171b22; display: flex; align-items: center; font-size: 17px; color: #e9ecf2;">reduce</div>
        <div class="mono" style="height: 48px; padding: 0 22px; border-radius: 10px; border: 1px solid #2a313c; background: #171b22; display: flex; align-items: center; font-size: 17px; color: #e9ecf2;">find</div>
      </div>
    </div>
  </div>

  <div style="height: 140px; border-top: 1px solid rgba(74, 201, 141, 0.35); background: rgba(74, 201, 141, 0.07); display: flex; align-items: center; justify-content: center;">
    <div style="width: 960px; display: flex; align-items: center; justify-content: space-between; gap: 32px;">
      <div style="display: flex; align-items: flex-start; gap: 18px;">
        <div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 999px; background: rgba(74, 201, 141, 0.18); display: flex; align-items: center; justify-content: center; color: #4ac98d;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 20px; font-weight: 700; color: #4ac98d;">¡Correcto!</span>
          <span style="font-size: 16px; color: #c9ced8;">filter se queda con las notas que cumplen n &gt;= 5.</span>
          <span class="mono" style="font-size: 15px; color: #949cad;">aprobadas <span style="color: #5b6270;">→</span> <span style="color: #4ac98d;">[7, 9, 5]</span></span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <span class="mono" style="font-size: 14px; font-weight: 600; color: #6fa8ff;">+10 XP</span>
        <div style="height: 48px; padding: 0 32px; border-radius: 10px; background: #4ac98d; color: #0a0b0e; font-size: 16px; font-weight: 600; display: flex; align-items: center;">Continuar</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
