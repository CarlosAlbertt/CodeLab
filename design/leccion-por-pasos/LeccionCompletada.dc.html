<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #0a0b0e; color: #e9ecf2; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #6fa8ff; text-decoration: none; }
    a:hover { color: #9cc3ff; }
    .mono { font-family: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
    @keyframes medalla { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
    @keyframes sube { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
    .medalla { animation: medalla 520ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    .sube { animation: sube 420ms ease-out both; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; background: #0a0b0e;">

  <div style="height: 72px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #1f242d;">
    <div style="width: 960px; display: flex; align-items: center; gap: 20px;">
      <div style="width: 40px; height: 40px; border-radius: 8px; border: 1px solid #2a313c; display: flex; align-items: center; justify-content: center; color: #949cad;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </div>
      <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px;">
        <div style="height: 6px; border-radius: 3px; background: #4ac98d;"></div>
        <div style="height: 6px; border-radius: 3px; background: #4ac98d;"></div>
        <div style="height: 6px; border-radius: 3px; background: #4ac98d;"></div>
        <div style="height: 6px; border-radius: 3px; background: #4ac98d;"></div>
        <div style="height: 6px; border-radius: 3px; background: #4ac98d;"></div>
        <div style="height: 6px; border-radius: 3px; background: #4ac98d;"></div>
        <div style="height: 6px; border-radius: 3px; background: #4ac98d;"></div>
        <div style="height: 6px; border-radius: 3px; background: #4ac98d;"></div>
      </div>
      <div class="mono" style="display: flex; align-items: center; gap: 6px; color: #6fa8ff; font-size: 14px; font-weight: 600;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"></path></svg>
        <span>80 XP</span>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; justify-content: center;">
    <div style="width: 600px; padding-top: 64px; display: flex; flex-direction: column; align-items: center;">
      <div class="medalla" style="width: 96px; height: 96px; border-radius: 999px; border: 2px solid #4ac98d; background: rgba(74, 201, 141, 0.12); display: flex; align-items: center; justify-content: center; color: #4ac98d;">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </div>
      <h1 class="sube" style="margin: 28px 0 0; font-size: 36px; font-weight: 600; letter-spacing: -0.01em; animation-delay: 120ms;">Lección completada</h1>
      <p class="sube" style="margin: 10px 0 0; font-size: 18px; color: #949cad; animation-delay: 160ms;">Arrays: filter, map y reduce</p>

      <div style="margin-top: 36px; width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
        <div class="sube" style="padding: 20px; border-radius: 12px; border: 1px solid #2a313c; background: #101318; display: flex; flex-direction: column; align-items: center; gap: 8px; animation-delay: 240ms;">
          <span style="color: #6fa8ff; display: flex;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"></path></svg></span>
          <span class="mono" style="font-size: 26px; font-weight: 600; color: #6fa8ff;">+80</span>
          <span style="font-size: 13px; color: #949cad;">XP ganados</span>
        </div>
        <div class="sube" style="padding: 20px; border-radius: 12px; border: 1px solid #2a313c; background: #101318; display: flex; flex-direction: column; align-items: center; gap: 8px; animation-delay: 300ms;">
          <span style="color: #4ac98d; display: flex;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle></svg></span>
          <span class="mono" style="font-size: 26px; font-weight: 600; color: #4ac98d;">7 / 8</span>
          <span style="font-size: 13px; color: #949cad;">a la primera</span>
        </div>
        <div class="sube" style="padding: 20px; border-radius: 12px; border: 1px solid #2a313c; background: #101318; display: flex; flex-direction: column; align-items: center; gap: 8px; animation-delay: 360ms;">
          <span style="color: #949cad; display: flex;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
          <span class="mono" style="font-size: 26px; font-weight: 600; color: #e9ecf2;">4 min</span>
          <span style="font-size: 13px; color: #949cad;">de lección</span>
        </div>
      </div>

      <div class="sube" style="margin-top: 12px; width: 100%; box-sizing: border-box; padding: 18px 20px; border-radius: 12px; border: 1px solid rgba(224, 173, 77, 0.30); background: rgba(224, 173, 77, 0.06); display: flex; align-items: center; justify-content: space-between; animation-delay: 420ms;">
        <div style="display: flex; align-items: center; gap: 14px;">
          <span style="color: #e0ad4d; display: flex;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5c.8 3.2 5 5.2 5 10a5 5 0 0 1-10 0c0-2.1 1-3.6 2.4-4.8.2 1.8 1.1 2.8 2.1 3.1-.4-3 .1-5.6.5-8.3z"></path></svg></span>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 16px; font-weight: 600;">Racha de 6 días</span>
            <span style="font-size: 14px; color: #949cad;">Hoy ya cuenta.</span>
          </div>
        </div>
        <div style="display: flex; gap: 6px;">
          <div style="width: 26px; height: 26px; border-radius: 999px; background: #e0ad4d;"></div>
          <div style="width: 26px; height: 26px; border-radius: 999px; background: #e0ad4d;"></div>
          <div style="width: 26px; height: 26px; border-radius: 999px; background: #e0ad4d;"></div>
          <div style="width: 26px; height: 26px; border-radius: 999px; background: #e0ad4d;"></div>
          <div style="width: 26px; height: 26px; border-radius: 999px; background: #e0ad4d;"></div>
          <div style="width: 26px; height: 26px; border-radius: 999px; background: #e0ad4d; box-shadow: 0 0 0 3px #0a0b0e, 0 0 0 5px #e0ad4d;"></div>
          <div style="width: 26px; height: 26px; border-radius: 999px; background: #1f242d;"></div>
        </div>
      </div>

      <div class="sube" style="margin-top: 32px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; animation-delay: 480ms;">
        <div style="width: 100%; height: 52px; border-radius: 10px; background: #6fa8ff; color: #0a0b0e; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px;">
          <span>Ir al caso práctico</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </div>
        <span style="font-size: 15px; color: #949cad;">Repasar el ejercicio que fallaste</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
