    <div class="mono" style="margin-top: 24px; padding: 16px 18px; background: #101318; border: 1px solid #2a313c; border-radius: 12px; font-size: 14px; line-height: 2.1; color: #e9ecf2;">

        <span>notas.</span>
        <span style="display: inline-block; width: 64px; height: 28px; margin: 0 2px; border-radius: 7px; border: 2px dashed #6fa8ff; background: rgba(111, 168, 255, 0.08);"></span>
